name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite

      - name: PHP lint
        run: find public_html tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Smoke test
        run: php tests/smoke.php
